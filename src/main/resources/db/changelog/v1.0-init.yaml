# =====================================================================
#  v1.0 - initial schema (minimal skeleton)
#  Only the id (primary key) of each table is declared.
#  To be completed: add the following columns (exercise.md Step 2 & Step 5):
#   - app_user : email, username, passwordHash, role, registrationDate
#   - listing  : title, description, price, category, creationDate, active,
#                user_id + (in v1.1) negotiable, streetAddress, city,
#                postalCode, country, latitude, longitude
#
#  NB: the table is named `app_user` (not `user`) because `user` is a
#      reserved keyword in PostgreSQL (it shadows `pg_catalog.user`).
#  NB: `user_id` on `listing` is the FK column to `app_user.id`.
#  NB: every migration must stay ADDITIVE (never modify an already
#      published changelog). V2 fields live in v1.1-v2-fields.yaml (Step 5).
# =====================================================================
databaseChangeLog:

  - changeSet:
      id: v1.0-1
      author: tp-skeleton
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

  - changeSet:
      id: v1.0-2
      author: tp-skeleton
      changes:
        - createTable:
            tableName: listing
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # NB: referential integrity is carried by a JPA relation
              # (@ManyToOne owner on the Listing entity -> app_user.id).
