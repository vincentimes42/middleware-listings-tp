# v1.0 - initial schema (ids only). Applied on day 1: never edit, add a new file instead.
databaseChangeLog:

  - changeSet:
      id: v1.0-1
      author: tp-skeleton
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

  - changeSet:
      id: v1.0-2
      author: tp-skeleton
      changes:
        - createTable:
            tableName: listing
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
