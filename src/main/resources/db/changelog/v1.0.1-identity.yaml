# v1.0.1 - identity columns on app_user (provided). Never edit.
databaseChangeLog:

  - changeSet:
      id: v1.0.1-1
      author: tp-skeleton
      changes:
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: registration_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
