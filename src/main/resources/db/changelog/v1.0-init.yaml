# =====================================================================
#  v1.0 - initial schema (minimal skeleton)
#  Only the id (primary key) of each table is declared.
#  Do NOT edit this file: it is already applied. The other columns come in
#  later, additive changelogs:
#   - v1.0.1-identity.yaml (provided)  : app_user identity columns
#   - v1.0.2-listing.yaml  (Step 2)    : listing V1 columns + user_id
#   - v1.1-v2-fields.yaml  (Step 5)    : listing V2 columns
#
#  NB: the table is named `app_user` (not `user`) because `user` is a
#      reserved keyword in PostgreSQL (it shadows `pg_catalog.user`).
#  NB: `user_id` on `listing` is the FK column to `app_user.id`.
#  NB: every migration must stay ADDITIVE (never modify an already
#      published changelog).
# =====================================================================
databaseChangeLog:

  - changeSet:
      id: v1.0-1
      author: tp-skeleton
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

  - changeSet:
      id: v1.0-2
      author: tp-skeleton
      changes:
        - createTable:
            tableName: listing
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # NB: referential integrity is carried by a JPA relation
              # (@ManyToOne owner on the Listing entity -> app_user.id).
