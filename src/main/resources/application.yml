# =====================================================================
#  Main configuration - exercise skeleton
#  The skeleton starts the application (Spring context + Liquibase v1.0).
#  To be completed: the configuration according to the subject.
# =====================================================================
spring:
  application:
    name: listings

  # ---------------- Database (SQLite) ----------------
  datasource:
    url: "jdbc:sqlite:listings.db"
    driver-class-name: org.sqlite.JDBC

  # ---------------- JPA / Hibernate ----------------
  jpa:
    hibernate:
      ddl-auto: none  # the schema is managed by Liquibase (not Hibernate)
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # ---------------- Liquibase ----------------
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # NB: JSON + XML content negotiation is left to Spring by default;
  #     to be enabled/implemented according to exercise.md Step 4 (bonus).

  # ---------------- Serialization (Jackson) ----------------
  # NB: null fields are NOT emitted by default (useful for the V1/V2
  #     visibility contract: a missing field = not exposed).
  jackson:
    default-property-inclusion: non_null

# ---------------- Monitoring / Actuator ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ---------------- API docs (OpenAPI / Swagger) ----------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ---------------- Logging ----------------
logging:
  level:
    com.app.listings: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ---------------- Application properties ----------------
listings:
  # default active version (fallback) - see exercise.md Step 6
  api:
    default-version: V1
    supported-versions: V1,V2
  # GPS enrichment (Nominatim) - see exercise.md Step 7
  geo:
    enabled: true
    endpoint: "https://nominatim.openstreetmap.org"
    timeout-ms: 3000
