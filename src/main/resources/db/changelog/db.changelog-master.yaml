# =====================================================================
#  Master changelog - orchestrates the migrations (YAML).
#  The skeleton provides v1.0 (id only) + v1.0.1 (identity columns on
#  app_user, used by Step 1). The student adds, in this order:
#    - v1.0.2-listing.yaml  (Step 2) : listing V1 columns + user_id
#    - v1.1-v2-fields.yaml  (Step 5) : negotiable, street_address, city,
#                                      postal_code, country, latitude, longitude
#  NB: every migration must stay ADDITIVE (never modify an already
#      published changelog).
# =====================================================================
databaseChangeLog:

  - include:
      file: classpath:db/changelog/v1.0-init.yaml
  - include:
      file: classpath:db/changelog/v1.0.1-identity.yaml

  # - include:
  #     file: classpath:db/changelog/v1.0.2-listing.yaml    # TODO (Step 2)
  # - include:
  #     file: classpath:db/changelog/v1.1-v2-fields.yaml    # TODO (Step 5)
