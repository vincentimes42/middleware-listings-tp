# =====================================================================
#  dev profile (externalized configuration)
#  Typical overrides (local datasource, DEBUG logging, etc.)
# =====================================================================
spring:
  # The skeleton already uses the local SQLite file (listings.db).
  # In dev you can adapt it, e.g. an in-memory database:
  #   url: "jdbc:sqlite::memory:"
  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    com.app.listings: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
