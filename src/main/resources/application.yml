# Main configuration. Every DB_* value is env-overridable (README, Run).
spring:
  application:
    name: listings

  # ---------------- Database (PostgreSQL) ----------------
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:listings}"
    username: "${DB_USER:listings}"
    password: "${DB_PASS:listings}"

  # ---------------- JPA / Hibernate ----------------
  jpa:
    hibernate:
      ddl-auto: none  # the schema is managed by Liquibase (not Hibernate)
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # ---------------- Liquibase ----------------
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # ---------------- Serialization (Jackson) ----------------
  # null fields are not serialized (used by exercise.md Step 6b)
  jackson:
    default-property-inclusion: non_null

# ---------------- Monitoring / Actuator ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ---------------- API docs (OpenAPI / Swagger) ----------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ---------------- Logging ----------------
logging:
  level:
    com.app.listings: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ---------------- Application properties ----------------
listings:
  # exercise.md Step 6a
  api:
    default-version: V1
    supported-versions: V1,V2
  # exercise.md Step 7
  geo:
    enabled: true
    endpoint: "https://nominatim.openstreetmap.org"
    timeout-ms: 3000
