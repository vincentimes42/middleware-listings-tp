# =====================================================================
#  dev profile (externalized configuration)
#  Typical overrides (local datasource, DEBUG logging, etc.)
# =====================================================================
spring:
  # The base datasource is PostgreSQL (see application.yml / docker-compose.yml).
  # In dev you can point at a scratch instance, or a throwaway DB, e.g.:
  #   url: "jdbc:postgresql://localhost:5435/listings_dev"
  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    com.app.listings: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
